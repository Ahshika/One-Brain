plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------------------
// Release secrets are never committed. They are read (in order) from Gradle
// properties (-P / ~/.gradle/gradle.properties) or local.properties.
// When absent, Google's official *test* AdMob IDs are used so the project
// always builds and never serves real ads by accident.
// ---------------------------------------------------------------------------
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) localPropsFile.withInputStream { localProps.load(it) }

def config = { String key, String fallback ->
    def value = project.findProperty(key) ?: localProps.getProperty(key)
    return (value ?: fallback).toString()
}

def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }

def TEST_APP_ID = 'ca-app-pub-3940256099942544~3347511713'
def TEST_BANNER = 'ca-app-pub-3940256099942544/9214589741'
def TEST_INTERSTITIAL = 'ca-app-pub-3940256099942544/1033173712'
def TEST_REWARDED = 'ca-app-pub-3940256099942544/5224354917'

android {
    namespace 'com.onebrain.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.onebrain.game'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        buildConfigField 'String', 'PLAY_LICENSE_KEY', "\"${config('ONEBRAIN_PLAY_LICENSE_KEY', '')}\""
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders = [admobAppId: TEST_APP_ID]
            buildConfigField 'String', 'AD_BANNER_ID', "\"${TEST_BANNER}\""
            buildConfigField 'String', 'AD_INTERSTITIAL_ID', "\"${TEST_INTERSTITIAL}\""
            buildConfigField 'String', 'AD_REWARDED_ID', "\"${TEST_REWARDED}\""
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) signingConfig signingConfigs.release
            manifestPlaceholders = [admobAppId: config('ONEBRAIN_ADMOB_APP_ID', TEST_APP_ID)]
            buildConfigField 'String', 'AD_BANNER_ID', "\"${config('ONEBRAIN_ADMOB_BANNER_ID', TEST_BANNER)}\""
            buildConfigField 'String', 'AD_INTERSTITIAL_ID', "\"${config('ONEBRAIN_ADMOB_INTERSTITIAL_ID', TEST_INTERSTITIAL)}\""
            buildConfigField 'String', 'AD_REWARDED_ID', "\"${config('ONEBRAIN_ADMOB_REWARDED_ID', TEST_REWARDED)}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'com.google.android.material:material:1.12.0'

    // Monetization
    implementation 'com.google.android.gms:play-services-ads:24.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.1.0'
    implementation 'com.android.billingclient:billing:8.0.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
